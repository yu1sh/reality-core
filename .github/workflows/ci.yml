name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: reality-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-gate:
    name: Public gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - name: Set up Java 17.0.20+8
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: 17.0.20+8
          architecture: x64
          check-latest: false
      - name: Set up Gradle 9.3.0
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
        with:
          gradle-version: 9.3.0

      - name: Verify exact toolchain and source head
        run: |
          python3 scripts/verify_toolchain.py --manifest toolchain-manifest.json --download-archive

      - name: Verify workflow and public source policy
        run: |
          python3 scripts/verify_ci_workflow.py
          python3 scripts/verify_dependency_metadata.py gradle/verification-metadata.xml
          python3 scripts/public_source_scan.py --repo-root . --tracked-only
          python3 scripts/test_public_source_scan.py
          python3 scripts/test_runtime_sbom.py

      - name: Online strict clean check
        run: |
          ./gradlew --dependency-verification=strict --no-daemon clean check

      - name: Offline strict clean check
        run: |
          ./gradlew --dependency-verification=strict --offline --no-daemon clean check

      - name: Re-run the exact unit contract suite
        run: |
          ./gradlew --dependency-verification=strict --offline --no-daemon clean test --rerun-tasks

      - name: Verify exact unit test report
        run: |
          python3 scripts/verify_test_report.py build/test-results/test --expected-tests 28

      - name: Verify Javadoc
        run: |
          ./gradlew --dependency-verification=strict --offline --no-daemon javadoc

      - name: Verify Java 17 bytecode
        run: |
          python3 scripts/verify_bytecode.py build/classes/java/main --expected-major 61

      - name: Verify jdeps
        run: |
          python3 scripts/verify_jdeps.py build/classes/java/main

      - name: Stage Maven publication first pass
        run: |
          ./gradlew --dependency-verification=strict --offline --no-daemon clean jar sourcesJar javadocJar publishMavenJavaPublicationToStagingRepository
          python3 scripts/verify_publication.py build/staging/repository
          python3 scripts/verify_reproducible_outputs.py --write ci-state/artifacts-first.json

      - name: Stage Maven publication second pass
        run: |
          ./gradlew --dependency-verification=strict --offline --no-daemon clean jar sourcesJar javadocJar publishMavenJavaPublicationToStagingRepository
          python3 scripts/verify_publication.py build/staging/repository
          python3 scripts/verify_reproducible_outputs.py --compare ci-state/artifacts-first.json

      - name: Verify runtime SBOM first pass
        run: |
          ./gradlew --dependency-verification=strict --offline --no-daemon clean runtimeSbom
          python3 scripts/verify_runtime_sbom.py build/reports/sbom/reality-core-runtime-sbom.json
          python3 scripts/verify_reproducible_sbom.py --write ci-state/sbom-first.json

      - name: Verify runtime SBOM second pass
        run: |
          ./gradlew --dependency-verification=strict --offline --no-daemon clean runtimeSbom
          python3 scripts/verify_runtime_sbom.py build/reports/sbom/reality-core-runtime-sbom.json
          python3 scripts/verify_reproducible_sbom.py --compare ci-state/sbom-first.json
